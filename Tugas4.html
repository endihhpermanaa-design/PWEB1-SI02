<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jquery Slideshow </title>
     <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
     <style>
        *{
             margin: 0;
            padding: 0;
            box-sizing: border-box;
         }
        body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
        display:flex;
        justify-content: center;
        align-items:center;
        min-height:100vh;
        padding: 20px;
        }
        .Slideshow-Container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow:0 10px
            40px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .slides-wrapper {
            position: relative;
            width: 100%;
            height: 450px;
            background: #000;
        }
        .slide{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height:100%;
            opacity: 0;

            transition: opacity 0.6s ease-in-out;
        }
        .slide img {
          width: 100%;
          height: 100%;
          object-fit: cover; 
        }
        .slide.active{
          opacity: 1;
        }
        .controls{
            display: flex;
            justify-content: space-between;
            padding: 24px 34px;
            background: #f0f0f0;
        }
        button{
            padding:12px 25px;
            font-size: 16px;
            font-weight: bold ;
            border:none;
            border-radius: 27px;
            cursor:pointer;
            transition: all 0.3s ease;color:white;
        }
        .nav-button.prev-btn{
            background: linear-gradient(135deg, #667eea 0%,#764ba2 100%);
        }
        .nav-button.next-btn{
            background: linear-gradient(135deg,#f093fb 0%,#f5576c 100%);
        }
        button:hover {
            transform:translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }
        button:active{
            transform: translateY(0);
        }
        .slide-info{
            position:absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color:white;
            padding: 10px 23px;
            border-radius: 23px;
            font-size: 14px;
            z-index: 10;
            text-align: center;
        }
        h1{
            text-align: center;
            padding: 23px;
            color:#333;
            font-size: 25px;
        }

    </style>
</head>
<body>
        <div class="Slideshow-Container">
            <h1>Jquery Slideshow</h1>
            <div class="slides-wrapper">
            <div class="slide active">
                <img src="https://server.wallpaperalchemy.com/storage/wallpapers/122/attack-on-titan-wallpaper-high-resolution-4k.jpg" alt ="Gambar 1">
                <div class="slide-info">Kapten Levi</div>
             </div>
             <div class="slide">
                <img src="https://wallpapers-clan.com/wp-content/uploads/2024/07/attack-on-titan-epic-scene-desktop-wallpaper-preview.jpg" alt="Gambar 2">
                <div class="slide-info">Iblis Eldia</div>
             </div>
             <div class="slide">
                 <img src="https://server.wallpaperalchemy.com/storage/wallpapers/122/attack-on-titan-wallpaper-high-resolution-4k.jpg" alt="Gambar 3">
                 <div class="slide-info">Mikasa Ackerman</div>
             </div>
            </div>
            <div class="controls">
                <button id="prev-btn" class="nav-button">&#10094;Prev</button>
                <button id="next-btn" class="nav-button">Next &#10095;</button>
                </div>          
            </div>
            <script>
                $(document).ready(function() {
                    let currentSlide = 0;
                    const $slides = $('.slide');
                    const totalSlides = $slides.length;

                    function showSlide(index){
                        $slides.removeClass('active');
                        $slides.eq(index).addClass('active');
                }
                $('#next-btn').on('click', function() {
                    currentSlide = (currentSlide + 1) % totalSlides;
                    showSlide(currentSlide);
                });
                $('#prev-btn').on('click', function(){
                    currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
                    showSlide(currentSlide);
                });
            });
            </script>
</body> 
</html>
